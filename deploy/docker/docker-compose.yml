services:
  postgres:
    image: postgres:16-alpine
    container_name: streamlite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - streamlite-net

  redis:
    image: redis:7-alpine
    container_name: streamlite-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - streamlite-net

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: streamlite-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${REDPANDA_KAFKA_PORT:-9092}
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
      - --schema-registry-addr=0.0.0.0:8081
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${REDPANDA_KAFKA_PORT:-9092}:29092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9644/v1/status/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      - streamlite-net

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: streamlite-seaweedfs
    restart: unless-stopped
    command: "server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3-config.json -s3.allowEmptyFolder=true -filer -filer.port=8888 -volume.max=100 -master.port=9333 -volume.port=8080 -ip=seaweedfs"
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
      - "${SEAWEEDFS_FILER_PORT:-8888}:8888"
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8333/ || curl -f -s http://localhost:8888/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      - streamlite-net

  seaweedfs-init:
    image: curlimages/curl:latest
    container_name: streamlite-seaweedfs-init
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Creating default buckets in SeaweedFS...' &&
        curl -s -X POST http://seaweedfs:8888/buckets/streamlite-raw/ || true &&
        curl -s -X POST http://seaweedfs:8888/buckets/streamlite-vod/ || true &&
        echo 'SeaweedFS buckets ready.'
      "
    networks:
      - streamlite-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: streamlite-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - streamlite-net

volumes:
  postgres_data:
    name: streamlite_postgres_data
  redis_data:
    name: streamlite_redis_data
  redpanda_data:
    name: streamlite_redpanda_data
  seaweedfs_data:
    name: streamlite_seaweedfs_data
  mailpit_data:
    name: streamlite_mailpit_data

networks:
  streamlite-net:
    name: streamlite-net
    driver: bridge
